services:
  # Docker runtime is required for audio: the image ships ffmpeg + PulseAudio
  # and docker-entrypoint.sh creates the virtual sink Chrome renders into.
  # Render's native Node runtime has neither, so audio would silently fail.
  - type: web
    name: remote-browser-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_BROWSERS
        value: 1
    healthCheckPath: /health
