services:
  # Native Node runtime: video streaming works, but audio capture needs
  # ffmpeg + pulseaudio, which aren't available here. Use a Docker-based
  # Render service (see Dockerfile) if audio is required.
  - type: web
    name: remote-browser-backend
    runtime: node
    plan: free
    buildCommand: npm install --production
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.1
      - key: PORT
        value: 10000
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: false
    healthCheckPath: /health
