<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Browser - Full Featured</title>
    <style>
            <div class="browser-bar">
                <div class="nav-buttons">
                    <button class="nav-btn" id="backBtn" title="Back (Alt+Left)" disabled>
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </button>
                    <button class="nav-btn" id="forwardBtn" title="Forward (Alt+Right)" disabled>
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </button>
                    <button class="nav-btn" id="refreshBtn" title="Refresh (F5)" disabled>
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                    </button>
                    <button class="nav-btn" id="homeBtn" title="Home" disabled>
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                        </svg>
                    </button>
                </div>
                
                <div class="url-bar">
                    <div class="loading-bar" id="loadingBar"></div>
                    <div class="security-indicator" id="securityIndicator">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 12px; height: 12px;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        HTTPS
                    </div>
                    <input type="text" id="urlInput" placeholder="Search or enter URL..." value="https://www.google.com">
                    <div class="url-actions">
                        <button class="url-action-btn" id="bookmarkBtn" title="Bookmark this page">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="suggestions" id="suggestions"></div>
                </div>
                
                <button class="go-btn" id="goBtn" disabled>Go</button>

                <div class="browser-actions">
                    <button class="action-btn" id="zoomBtn" title="Zoom">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"></path>
                        </svg>
                        <div class="dropdown-menu" id="zoomMenu">
                            <div class="zoom-controls">
                                <button class="zoom-btn" id="zoomOut">-</button>
                                <span class="zoom-level" id="zoomLevel">100%</span>
                                <button class="zoom-btn" id="zoomIn">+</button>
                            </div>
                            <div class="menu-separator"></div>
                            <div class="menu-item" data-action="resetZoom">
                                <span>Reset Zoom</span>
                            </div>
                        </div>
                    </button>

                    <button class="action-btn" id="downloadsBtn" title="Downloads">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"></path>
                        </svg>
                    </button>

                    <button class="action-btn" id="historyBtn" title="History (Ctrl+H)">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </button>

                    <button class="action-btn" id="bookmarksBtn" title="Bookmarks (Ctrl+Shift+B)">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                        </svg>
                    </button>

                    <button class="action-btn" id="fullscreenBtn" title="Fullscreen (F11)">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                        </svg>
                    </button>

                    <button class="action-btn" id="settingsBtn" title="Settings">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        <div class="dropdown-menu" id="settingsMenu">
                            <div class="menu-item" data-action="settings-fps">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                </svg>
                                <span>FPS: <span id="fpsDisplay">60</span></span>
                            </div>
                            <div class="menu-item" data-action="settings-quality">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                </svg>
                                <span>Quality: <span id="qualityDisplay">85</span>%</span>
                            </div>
                            <div class="menu-separator"></div>
                            <div class="menu-item" data-action="clear-history">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                                <span>Clear History</span>
                            </div>
                            <div class="menu-item" data-action="clear-cache">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                </svg>
                                <span>Clear Cache</span>
                            </div>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Stream Controls -->
            <div class="controls">
                <div class="settings">
                    <label>
                        <input type="checkbox" id="interactiveMode" checked>
                        Interactive Mode
                    </label>
                    <label title="Stream FPS">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 14px; height: 14px;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        <input type="number" id="fpsInput" min="15" max="60" value="60"> FPS
                    </label>
                    <label title="JPEG Quality">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 14px; height: 14px;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <input type="number" id="qualityInput" min="50" max="100" value="85">%
                    </label>
                </div>

                <div class="btn-group">
                    <button class="btn-primary" id="startBtn">🚀 Start Browser</button>
                    <button class="btn-danger" id="stopBtn" disabled>⏹ Stop</button>
                </div>
            </div>

            <!-- Browser Viewer -->
            <div class="viewer-container" id="viewerContainer">
                <div class="viewer" id="viewer">
                    <img id="stream" alt="Stream">
                    <div class="placeholder" id="placeholder">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                        <p>Click "Start Browser" to begin browsing</p>
                    </div>
                </div>

                <!-- Interaction Toolbar -->
                <div class="interaction-toolbar" id="toolbar">
                    <button class="tool-btn active" id="clickTool" title="Click Mode (C)">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path>
                        </svg>
                    </button>
                    <button class="tool-btn" id="scrollTool" title="Scroll Mode (S)">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Statistics -->
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">Status</span>
                    <span class="stat-value"><span class="status status-disconnected" id="status">Disconnected</span></span>
                </div>
                <div class="stat">
                    <span class="stat-label">Current URL</span>
                    <span class="stat-value" id="currentUrl" style="font-size: 11px; color: #667eea; max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">FPS</span>
                    <span class="stat-value" id="currentFps">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Frames</span>
                    <span class="stat-value" id="frameCount">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Latency</span>
                    <span class="stat-value" id="latency">0ms</span>
                </div>
            </div>
        </div>

        <!-- History Sidebar -->
        <div class="sidebar" id="historySidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">📜 History</span>
                <button class="sidebar-close" id="closeHistory">✕</button>
            </div>
            <div class="sidebar-content" id="historyContent">
                <p style="color: #9ca3af; text-align: center; padding: 20px;">No history yet</p>
            </div>
        </div>

        <!-- Bookmarks Sidebar -->
        <div class="sidebar" id="bookmarksSidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">⭐ Bookmarks</span>
                <button class="sidebar-close" id="closeBookmarks">✕</button>
            </div>
            <div class="sidebar-content" id="bookmarksContent">
                <p style="color: #9ca3af; text-align: center; padding: 20px;">No bookmarks yet</p>
            </div>
        </div>

        <!-- Downloads Sidebar -->
        <div class="sidebar" id="downloadsSidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">⬇️ Downloads</span>
                <button class="sidebar-close" id="closeDownloads">✕</button>
            </div>
            <div class="sidebar-content" id="downloadsContent">
                <p style="color: #9ca3af; text-align: center; padding: 20px;">No downloads</p>
            </div>
        </div>
    </div>

    <script src="browser.js"></script>
</body>
</html>
